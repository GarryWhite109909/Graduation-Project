<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫描工作台</title>
    <style id="theme-vars">
/* Vuln Scanner UI — Cyber-security dark theme tokens */

:root {
  /* Neutral scale */
  --vuln-bg: #0b0f17;
  --vuln-surface: #111827;
  --vuln-surface-2: #1f2937;
  --vuln-ink: #e6edf3;
  --vuln-ink-2: #8b949e;
  --vuln-ink-3: #6e7681;
  --vuln-line: #30363d;

  /* Brand primary — tech blue */
  --vuln-brand: #3b82f6;
  --vuln-brand-ink: #ffffff;
  --vuln-brand-50: #eff6ff;
  --vuln-brand-100: #dbeafe;
  --vuln-brand-200: #bfdbfe;
  --vuln-brand-300: #93c5fd;
  --vuln-brand-400: #60a5fa;
  --vuln-brand-500: #3b82f6;
  --vuln-brand-600: #2563eb;
  --vuln-brand-700: #1d4ed8;

  /* Semantic state colors */
  --vuln-state-success: #22c55e;
  --vuln-state-warning: #f59e0b;
  --vuln-state-error: #ef4444;
  --vuln-state-info: #58a6ff;

  /* Semantic aliases required by head contract */
  --vuln-background: var(--vuln-bg);
  --vuln-foreground: var(--vuln-ink);
  --vuln-card: var(--vuln-surface);
  --vuln-card-foreground: var(--vuln-ink);
  --vuln-popover: var(--vuln-surface-2);
  --vuln-popover-foreground: var(--vuln-ink);
  --vuln-primary: var(--vuln-brand);
  --vuln-primary-foreground: var(--vuln-brand-ink);
  --vuln-muted: var(--vuln-surface-2);
  --vuln-muted-foreground: var(--vuln-ink-2);
  --vuln-border: var(--vuln-line);
  --vuln-input: var(--vuln-line);
  --vuln-ring: var(--vuln-brand-500);
  --vuln-radius-small: 4px;
  --vuln-radius-medium: 8px;
  --vuln-radius-large: 16px;

  /* Spacing */
  --vuln-s-1: 4px;
  --vuln-s-2: 8px;
  --vuln-s-3: 12px;
  --vuln-s-4: 16px;
  --vuln-s-5: 24px;
  --vuln-s-6: 32px;
  --vuln-s-7: 48px;
  --vuln-s-8: 80px;

  /* Typography */
  --vuln-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --vuln-font-mono: "Cascadia Code", "Fira Code", Consolas, Monaco, "Courier New", monospace;

  /* Shadows */
  --vuln-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 1px rgba(15, 23, 42, 0.03);
  --vuln-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --vuln-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
}

/* Base typography classes */
.vuln-font-sans { font-family: var(--vuln-font-sans); }
.vuln-font-mono { font-family: var(--vuln-font-mono); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--vuln-background);
    --color-foreground: var(--vuln-foreground);
    --color-card: var(--vuln-card);
    --color-card-foreground: var(--vuln-card-foreground);
    --color-popover: var(--vuln-popover);
    --color-popover-foreground: var(--vuln-popover-foreground);
    --color-primary: var(--vuln-primary);
    --color-primary-foreground: var(--vuln-primary-foreground);
    --color-muted: var(--vuln-muted);
    --color-muted-foreground: var(--vuln-muted-foreground);
    --color-border: var(--vuln-border);
    --color-input: var(--vuln-input);
    --color-ring: var(--vuln-ring);
    --radius-sm: var(--vuln-radius-small);
    --radius-md: var(--vuln-radius-medium);
    --radius-lg: var(--vuln-radius-large);
  }
  @layer base {
    body { background: var(--vuln-background); color: var(--vuln-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .text-background { color: var(--vuln-background); }

      .ring-foreground { --tw-ring-color: var(--vuln-foreground); }

      .border-card { border-color: var(--vuln-card); }
      .ring-card { --tw-ring-color: var(--vuln-card); }
      .bg-card-foreground { background-color: var(--vuln-card-foreground); }
      .text-card-foreground { color: var(--vuln-card-foreground); }
      .border-card-foreground { border-color: var(--vuln-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--vuln-card-foreground); }
      .bg-popover { background-color: var(--vuln-popover); }
      .text-popover { color: var(--vuln-popover); }
      .border-popover { border-color: var(--vuln-popover); }
      .ring-popover { --tw-ring-color: var(--vuln-popover); }
      .bg-popover-foreground { background-color: var(--vuln-popover-foreground); }
      .text-popover-foreground { color: var(--vuln-popover-foreground); }
      .border-popover-foreground { border-color: var(--vuln-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--vuln-popover-foreground); }
      .bg-primary { background-color: var(--vuln-primary); }
      .text-primary { color: var(--vuln-primary); }
      .border-primary { border-color: var(--vuln-primary); }
      .ring-primary { --tw-ring-color: var(--vuln-primary); }
      .bg-primary-foreground { background-color: var(--vuln-primary-foreground); }
      .text-primary-foreground { color: var(--vuln-primary-foreground); }
      .border-primary-foreground { border-color: var(--vuln-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--vuln-primary-foreground); }
      .bg-muted { background-color: var(--vuln-muted); }
      .text-muted { color: var(--vuln-muted); }
      .border-muted { border-color: var(--vuln-muted); }
      .ring-muted { --tw-ring-color: var(--vuln-muted); }
      .bg-muted-foreground { background-color: var(--vuln-muted-foreground); }
      .text-muted-foreground { color: var(--vuln-muted-foreground); }
      .border-muted-foreground { border-color: var(--vuln-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--vuln-muted-foreground); }
      .bg-border { background-color: var(--vuln-border); }
      .text-border { color: var(--vuln-border); }
      .border-border { border-color: var(--vuln-border); }
      .ring-border { --tw-ring-color: var(--vuln-border); }
      .bg-input { background-color: var(--vuln-input); }
      .text-input { color: var(--vuln-input); }
      .border-input { border-color: var(--vuln-input); }
      .ring-input { --tw-ring-color: var(--vuln-input); }
      .bg-ring { background-color: var(--vuln-ring); }
      .text-ring { color: var(--vuln-ring); }
      .border-ring { border-color: var(--vuln-ring); }
      .ring-ring { --tw-ring-color: var(--vuln-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <style id="critical-layout">
      .scan-layout {
        display: flex;
        gap: 24px;
        padding: 88px 24px 24px;
        max-width: 1600px;
        margin: 0 auto;
      }
      .control-panel {
        position: sticky;
        top: 72px;
        align-self: flex-start;
        flex: 0 0 360px;
        width: 360px;
      }
      .results-panel {
        flex: 1 1 auto;
        min-width: 0;
      }
      .result-card {
        background-color: var(--vuln-surface);
        border: 1px solid var(--vuln-line);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .code-block {
        font-family: var(--vuln-font-mono);
        background-color: var(--vuln-bg);
        border: 1px solid var(--vuln-line);
        border-radius: 4px;
        padding: 12px;
        overflow-x: auto;
        white-space: pre;
        font-size: 13px;
        line-height: 1.5;
        color: var(--vuln-ink);
      }
      .progress-bar {
        height: 6px;
        background-color: var(--vuln-line);
        border-radius: 999px;
        overflow: hidden;
      }
      .progress-bar > span {
        display: block;
        height: 100%;
        width: 0%;
        background-color: var(--vuln-brand);
        transition: width 0.3s ease;
      }
      @media (max-width: 1024px) {
        .scan-layout { flex-direction: column; }
        .control-panel { position: static; width: 100%; flex: none; }
      }
    </style>

    <nav class="fixed top-0 left-0 right-0 z-50 border-b border-[var(--vuln-line)] bg-[var(--vuln-bg)]/90 backdrop-blur">
      <div class="max-w-[1600px] mx-auto px-6 h-14 flex items-center justify-between">
        <a href="./index.html" class="flex items-center gap-2 text-[var(--vuln-ink)] font-semibold">
          <svg class="w-6 h-6 text-[var(--vuln-brand)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
            <path d="M2 17l10 5 10-5"></path>
            <path d="M2 12l10 5 10-5"></path>
          </svg>
          <span>VulnScanner</span>
        </a>
        <ul class="flex items-center gap-1">
          <li><a id="nav-dashboard" data-dom-id="nav-dashboard" href="./index.html" class="text-sm font-medium text-[var(--vuln-ink-2)] hover:text-[var(--vuln-ink)] transition-colors px-3 py-2 rounded-md">仪表盘</a></li>
          <li><a id="nav-scan" data-dom-id="nav-scan" href="./scan.html" class="text-[var(--vuln-brand)] bg-[var(--vuln-brand)]/10 text-sm font-medium px-3 py-2 rounded-md" aria-current="page">扫描工作台</a></li>
          <li><a id="nav-cwe" data-dom-id="nav-cwe" href="./cwe.html" class="text-sm font-medium text-[var(--vuln-ink-2)] hover:text-[var(--vuln-ink)] transition-colors px-3 py-2 rounded-md">CWE 样本库</a></li>
          <li><a id="nav-posture" data-dom-id="nav-posture" href="./posture.html" class="text-sm font-medium text-[var(--vuln-ink-2)] hover:text-[var(--vuln-ink)] transition-colors px-3 py-2 rounded-md">安全态势</a></li>
        </ul>
      </div>
    </nav>

    <main class="scan-layout">
      <section class="control-panel bg-[var(--vuln-surface)] border border-[var(--vuln-line)] rounded-lg p-5" aria-label="扫描输入">
        <div class="flex items-center justify-between mb-4">
          <h1 class="text-lg font-semibold text-[var(--vuln-ink)]">新建扫描</h1>
          <span class="text-xs px-2 py-1 rounded bg-[var(--vuln-surface-2)] text-[var(--vuln-ink-2)]">静态分析</span>
        </div>

        <div class="flex gap-1 mb-4 p-1 bg-[var(--vuln-bg)] rounded-md border border-[var(--vuln-line)]" role="tablist" aria-label="输入方式">
          <button id="tab-paste" type="button" role="tab" aria-selected="true" aria-controls="panel-paste" class="flex-1 text-sm px-2 py-1.5 rounded text-[var(--vuln-brand)] bg-[var(--vuln-brand)]/10 font-medium">粘贴代码</button>
          <button id="tab-upload" type="button" role="tab" aria-selected="false" aria-controls="panel-upload" class="flex-1 text-sm px-2 py-1.5 rounded text-[var(--vuln-ink-2)] hover:text-[var(--vuln-ink)] hover:bg-[var(--vuln-surface-2)] transition-colors font-medium">上传文件</button>
          <button id="tab-url" type="button" role="tab" aria-selected="false" aria-controls="panel-url" class="flex-1 text-sm px-2 py-1.5 rounded text-[var(--vuln-ink-2)] hover:text-[var(--vuln-ink)] hover:bg-[var(--vuln-surface-2)] transition-colors font-medium">URL/站点</button>
          <button id="tab-github" type="button" role="tab" aria-selected="false" aria-controls="panel-github" class="flex-1 text-sm px-2 py-1.5 rounded text-[var(--vuln-ink-2)] hover:text-[var(--vuln-ink)] hover:bg-[var(--vuln-surface-2)] transition-colors font-medium">GitHub</button>
        </div>

        <div class="tab-panels">
          <div id="panel-paste" role="tabpanel" class="tab-panel">
            <label for="code-input" class="block text-xs text-[var(--vuln-ink-2)] mb-2">粘贴需要审计的源代码</label>
            <textarea id="code-input" rows="12" class="w-full bg-[var(--vuln-bg)] border border-[var(--vuln-line)] rounded-md p-3 text-sm text-[var(--vuln-ink)] font-mono focus:outline-none focus:ring-2 focus:ring-[var(--vuln-brand)] resize-none" placeholder="function query(userInput) {&#10;  return db.exec('SELECT * FROM users WHERE id = ' + userInput);&#10;}"></textarea>
          </div>
          <div id="panel-upload" role="tabpanel" class="tab-panel hidden">
            <div id="upload-dropzone" class="border-2 border-dashed border-[var(--vuln-line)] rounded-md p-8 text-center bg-[var(--vuln-bg)] hover:border-[var(--vuln-brand)]/60 transition-colors cursor-pointer">
              <svg class="w-8 h-8 mx-auto mb-2 text-[var(--vuln-ink-3)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <p id="upload-hint" class="text-sm text-[var(--vuln-ink-2)]">拖拽文件到此处，或点击选择</p>
              <p class="text-xs text-[var(--vuln-ink-3)] mt-1">支持 .py、.js、.ts、.java、.php、.go 等</p>
              <input id="upload-input" type="file" multiple class="hidden" aria-label="上传文件" />
            </div>
            <div id="upload-file-list" class="mt-2 space-y-1 text-xs text-[var(--vuln-ink-2)]"></div>
          </div>
          <div id="panel-url" role="tabpanel" class="tab-panel hidden">
            <label for="url-input" class="block text-xs text-[var(--vuln-ink-2)] mb-2">目标站点 URL</label>
            <input id="url-input" type="url" class="w-full bg-[var(--vuln-bg)] border border-[var(--vuln-line)] rounded-md p-3 text-sm text-[var(--vuln-ink)] focus:outline-none focus:ring-2 focus:ring-[var(--vuln-brand)]" placeholder="https://example.com/api" />
            <p class="text-xs text-[var(--vuln-ink-3)] mt-2">将对站点进行远程静态资源与端点分析。</p>
          </div>
          <div id="panel-github" role="tabpanel" class="tab-panel hidden">
            <label for="github-input" class="block text-xs text-[var(--vuln-ink-2)] mb-2">GitHub 仓库地址</label>
            <input id="github-input" type="text" class="w-full bg-[var(--vuln-bg)] border border-[var(--vuln-line)] rounded-md p-3 text-sm text-[var(--vuln-ink)] focus:outline-none focus:ring-2 focus:ring-[var(--vuln-brand)]" placeholder="owner/repository" />
            <p class="text-xs text-[var(--vuln-ink-3)] mt-2">默认拉取默认分支，最大扫描深度为 5 层目录。</p>
          </div>
        </div>

        <div class="mt-4 flex items-center justify-between text-xs text-[var(--vuln-ink-2)]">
          <span id="engine-info">引擎: 检查中…</span>
          <label class="flex items-center gap-1.5 cursor-pointer select-none">
            <input id="rag-toggle" type="checkbox" checked class="accent-[var(--vuln-brand)] w-3.5 h-3.5" />
            <span>RAG 增强</span>
          </label>
        </div>

        <div id="scan-progress" class="mt-4 hidden">
          <div class="flex items-center justify-between text-xs mb-1">
            <span id="scan-status" class="text-[var(--vuln-ink-2)]">正在初始化分析引擎…</span>
            <span id="scan-percent" class="text-[var(--vuln-brand)] font-mono">0%</span>
          </div>
          <div class="progress-bar" aria-label="扫描进度">
            <span id="scan-progress-fill"></span>
          </div>
        </div>

        <button id="btn-analyze" type="button" class="mt-5 w-full inline-flex items-center justify-center gap-2 bg-[var(--vuln-brand)] hover:bg-[var(--vuln-brand-600)] text-white text-sm font-medium px-4 py-2.5 rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-[var(--vuln-brand)] focus:ring-offset-2 focus:ring-offset-[var(--vuln-surface)]">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          开始分析
        </button>
      </section>

      <section class="results-panel" aria-label="扫描结果">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-3">
            <h2 class="text-lg font-semibold text-[var(--vuln-ink)]">检测结果</h2>
            <span id="result-count" class="text-xs text-[var(--vuln-ink-2)]">共 <strong class="text-[var(--vuln-ink)]">0</strong> 项</span>
          </div>
          <div class="flex flex-wrap gap-2" role="group" aria-label="严重级别筛选">
            <button type="button" data-filter="all" class="filter-chip active text-xs px-3 py-1.5 rounded-full border border-[var(--vuln-line)] bg-[var(--vuln-brand)]/10 text-[var(--vuln-brand)] font-medium">全部</button>
            <button type="button" data-filter="critical" class="filter-chip text-xs px-3 py-1.5 rounded-full border border-[var(--vuln-line)] text-[var(--vuln-ink-2)] hover:text-[var(--vuln-ink)] hover:bg-[var(--vuln-surface-2)] transition-colors">严重</button>
            <button type="button" data-filter="high" class="filter-chip text-xs px-3 py-1.5 rounded-full border border-[var(--vuln-line)] text-[var(--vuln-ink-2)] hover:text-[var(--vuln-ink)] hover:bg-[var(--vuln-surface-2)] transition-colors">高危</button>
            <button type="button" data-filter="medium" class="filter-chip text-xs px-3 py-1.5 rounded-full border border-[var(--vuln-line)] text-[var(--vuln-ink-2)] hover:text-[var(--vuln-ink)] hover:bg-[var(--vuln-surface-2)] transition-colors">中危</button>
            <button type="button" data-filter="low" class="filter-chip text-xs px-3 py-1.5 rounded-full border border-[var(--vuln-line)] text-[var(--vuln-ink-2)] hover:text-[var(--vuln-ink)] hover:bg-[var(--vuln-surface-2)] transition-colors">低危</button>
            <button type="button" data-filter="none" class="filter-chip text-xs px-3 py-1.5 rounded-full border border-[var(--vuln-line)] text-[var(--vuln-ink-2)] hover:text-[var(--vuln-ink)] hover:bg-[var(--vuln-surface-2)] transition-colors">安全</button>
          </div>
        </div>

        <div id="results-panel">
          <div class="text-center py-16 text-[var(--vuln-ink-3)] text-sm">
            <svg class="w-12 h-12 mx-auto mb-3 opacity-30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <p>点击「开始分析」启动漏洞扫描</p>
          </div>
        </div>
      </section>
    </main>

    <script>
      (function () {
        'use strict';

        // ── DOM 引用 ──────────────────────────────────
        var tabs = [
          document.getElementById('tab-paste'),
          document.getElementById('tab-upload'),
          document.getElementById('tab-url'),
          document.getElementById('tab-github')
        ];
        var panels = [
          document.getElementById('panel-paste'),
          document.getElementById('panel-upload'),
          document.getElementById('panel-url'),
          document.getElementById('panel-github')
        ];
        var tabKeys = ['paste', 'upload', 'url', 'github'];
        var activeClass = ['text-[var(--vuln-brand)]', 'bg-[var(--vuln-brand)]/10'];
        var inactiveClass = ['text-[var(--vuln-ink-2)]', 'hover:text-[var(--vuln-ink)]', 'hover:bg-[var(--vuln-surface-2)]'];
        var currentTab = 'paste';
        var uploadedFiles = [];

        var analyzeBtn = document.getElementById('btn-analyze');
        var progressWrap = document.getElementById('scan-progress');
        var progressFill = document.getElementById('scan-progress-fill');
        var scanStatus = document.getElementById('scan-status');
        var scanPercent = document.getElementById('scan-percent');
        var resultsPanel = document.getElementById('results-panel');
        var resultCount = document.getElementById('result-count');
        var activeFilter = 'all';

        // ── 工具函数 ──────────────────────────────────
        function esc(s) {
          if (!s) return '';
          return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function detectLang(filename) {
          var ext = (filename.split('.').pop() || '').toLowerCase();
          var map = {
            py: 'python', js: 'javascript', ts: 'typescript', jsx: 'javascript', tsx: 'typescript',
            java: 'java', go: 'go', php: 'php', c: 'c', h: 'c', cpp: 'cpp', cc: 'cpp', cxx: 'cpp',
            cs: 'csharp', rb: 'ruby', rs: 'rust', swift: 'swift', kt: 'kotlin', scala: 'scala',
            sh: 'bash', bash: 'bash', zsh: 'bash', pl: 'perl', lua: 'lua', r: 'r', sql: 'sql'
          };
          return map[ext] || 'unknown';
        }

        var riskMeta = {
          critical: { label: '严重', color: 'error', icon: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line>' },
          high:     { label: '高危', color: 'error', icon: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line>' },
          medium:   { label: '中危', color: 'warning', icon: '<path d="M12 9v2m0 4h.01"></path><path d="M5.25 20h13.5a2.25 2.25 0 0 0 1.96-3.35L14.18 4.6a2.25 2.25 0 0 0-4.36 0L3.29 16.65A2.25 2.25 0 0 0 5.25 20z"></path>' },
          low:      { label: '低危', color: 'info', icon: '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>' },
          none:     { label: '安全', color: 'success', icon: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>' }
        };

        function renderResultCard(r) {
          var risk = (r.risk_level || 'none').toLowerCase();
          var meta = riskMeta[risk] || riskMeta.none;
          var isVuln = r.has_vulnerability;
          var stateVar = 'var(--vuln-state-' + meta.color + ')';
          var chunks = r.chunk_count > 1 ? ' · ' + r.chunk_count + ' chunks' : '';
          var duration = r.duration ? ' · ' + r.duration.toFixed(1) + 's' : '';

          var html = '<article class="result-card" data-risk="' + risk + '">';
          html += '<div class="flex items-start justify-between gap-4 mb-3">';
          html += '<div class="flex items-center gap-3">';
          html += '<span class="inline-flex items-center gap-1 px-2 py-1 rounded text-xs font-semibold" style="background:' + stateVar + '1a;color:' + stateVar + ';border:1px solid ' + stateVar + '33">';
          html += '<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + meta.icon + '</svg>';
          html += meta.label;
          html += '</span>';
          if (r.vulnerability_type && r.vulnerability_type !== 'none') {
            html += '<span class="text-xs font-mono text-[var(--vuln-ink-3)]">' + esc(r.vulnerability_type) + '</span>';
          }
          html += '</div>';
          if (r.raw_output) {
            html += '<button type="button" class="toggle-code text-xs text-[var(--vuln-brand)] hover:text-[var(--vuln-brand-300)] font-medium" aria-expanded="false">展开详情</button>';
          }
          html += '</div>';

          if (isVuln) {
            html += '<h3 class="text-base font-semibold text-[var(--vuln-ink)] mb-1">' + esc(r.vulnerability_type) + '</h3>';
          } else {
            html += '<h3 class="text-base font-semibold text-[var(--vuln-state-success)] mb-1">未检测到漏洞</h3>';
          }
          html += '<p class="text-xs text-[var(--vuln-ink-3)] mb-2 font-mono">' + esc(r.filename) + chunks + duration + '</p>';

          if (r.explanation) {
            html += '<p class="text-sm text-[var(--vuln-ink-2)] mb-2">' + esc(r.explanation) + '</p>';
          }
          if (r.source && r.sink) {
            html += '<p class="text-xs text-[var(--vuln-ink-3)] mb-2 font-mono">source: ' + esc(r.source) + ' → sink: ' + esc(r.sink) + '</p>';
          }
          if (r.fix_suggestion) {
            html += '<div class="text-xs text-[var(--vuln-ink-2)] bg-[var(--vuln-bg)] border border-[var(--vuln-line)] rounded-md p-3 mb-2"><strong class="text-[var(--vuln-state-success)]">修复建议：</strong> ' + esc(r.fix_suggestion) + '</div>';
          }
          if (r.error) {
            html += '<div class="text-xs text-[var(--vuln-state-error)] mb-2">错误: ' + esc(r.error) + '</div>';
          }

          if (r.raw_output) {
            html += '<div class="code-block hidden" role="region" aria-label="LLM 原始输出"><pre class="text-xs text-[var(--vuln-ink-2)] whitespace-pre-wrap break-words font-mono p-3 bg-[var(--vuln-bg)] rounded-md border border-[var(--vuln-line)] overflow-x-auto">' + esc(r.raw_output) + '</pre></div>';
          }
          html += '</article>';
          return html;
        }

        function renderSummary(summary) {
          if (!summary) return '';
          var s = summary;
          var html = '<div class="mb-4 p-4 rounded-md bg-[var(--vuln-surface-2)] border border-[var(--vuln-line)] text-sm">';
          html += '<div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">';
          html += '<div><div class="text-2xl font-bold text-[var(--vuln-ink)]">' + (s.scanned || 0) + '</div><div class="text-xs text-[var(--vuln-ink-3)]">已扫描</div></div>';
          html += '<div><div class="text-2xl font-bold text-[var(--vuln-state-error)]">' + (s.vulnerable || 0) + '</div><div class="text-xs text-[var(--vuln-ink-3)]">有漏洞</div></div>';
          html += '<div><div class="text-2xl font-bold text-[var(--vuln-state-success)]">' + (s.safe || 0) + '</div><div class="text-xs text-[var(--vuln-ink-3)]">安全</div></div>';
          html += '<div><div class="text-2xl font-bold text-[var(--vuln-state-warning)]">' + (s.errors || 0) + '</div><div class="text-xs text-[var(--vuln-ink-3)]">错误</div></div>';
          html += '</div>';
          if (s.total_duration) {
            html += '<div class="text-xs text-[var(--vuln-ink-3)] text-center mt-2">总耗时 ' + s.total_duration.toFixed(1) + 's</div>';
          }
          html += '</div>';
          return html;
        }

        function updateResults(results, summary) {
          var html = '';
          if (summary) html += renderSummary(summary);
          var vulnResults = results.filter(function(r) { return r.has_vulnerability; });
          var safeResults = results.filter(function(r) { return !r.has_vulnerability; });
          // 漏洞在前，安全在后
          vulnResults.forEach(function(r) { html += renderResultCard(r); });
          safeResults.forEach(function(r) { html += renderResultCard(r); });

          if (!results.length) {
            html = '<div class="text-center py-12 text-[var(--vuln-ink-3)] text-sm">未找到可分析的脚本</div>';
          }

          resultsPanel.innerHTML = html;
          resultCount.innerHTML = '共 <strong class="text-[var(--vuln-ink)]">' + results.length + '</strong> 项';
          applyFilter();
        }

        function applyFilter() {
          var cards = resultsPanel.querySelectorAll('.result-card');
          cards.forEach(function(card) {
            if (activeFilter === 'all' || card.getAttribute('data-risk') === activeFilter) {
              card.style.display = '';
            } else {
              card.style.display = 'none';
            }
          });
        }

        // ── 进度条 ──────────────────────────────────
        function showProgress(text) {
          progressWrap.classList.remove('hidden');
          scanStatus.textContent = text || '正在分析…';
          progressFill.style.width = '5%';
          scanPercent.textContent = '';
        }
        function updateProgress(pct, text) {
          progressFill.style.width = pct + '%';
          if (text) scanStatus.textContent = text;
          scanPercent.textContent = pct + '%';
        }
        function hideProgress() {
          progressWrap.classList.add('hidden');
        }

        function setBusy(busy) {
          analyzeBtn.disabled = busy;
          analyzeBtn.classList.toggle('opacity-60', busy);
          analyzeBtn.classList.toggle('cursor-not-allowed', busy);
        }

        // ── Tab 切换 ──────────────────────────────────
        function switchTab(index) {
          currentTab = tabKeys[index];
          tabs.forEach(function(tab, i) {
            var selected = i === index;
            tab.setAttribute('aria-selected', String(selected));
            tab.classList.remove.apply(tab.classList, activeClass.concat(inactiveClass));
            if (selected) {
              tab.classList.add.apply(tab.classList, activeClass);
              panels[i].classList.remove('hidden');
            } else {
              tab.classList.add.apply(tab.classList, inactiveClass);
              panels[i].classList.add('hidden');
            }
          });
        }
        tabs.forEach(function(tab, i) {
          tab.addEventListener('click', function() { switchTab(i); });
        });

        // ── 文件上传 ──────────────────────────────────
        var dropzone = document.getElementById('upload-dropzone');
        var fileInput = document.getElementById('upload-input');
        var fileListEl = document.getElementById('upload-file-list');

        dropzone.addEventListener('click', function() { fileInput.click(); });
        fileInput.addEventListener('change', function() {
          uploadedFiles = Array.prototype.slice.call(fileInput.files);
          renderFileList();
        });
        dropzone.addEventListener('dragover', function(e) {
          e.preventDefault();
          dropzone.classList.add('border-[var(--vuln-brand)]', 'bg-[var(--vuln-brand)]/5');
        });
        dropzone.addEventListener('dragleave', function() {
          dropzone.classList.remove('border-[var(--vuln-brand)]', 'bg-[var(--vuln-brand)]/5');
        });
        dropzone.addEventListener('drop', function(e) {
          e.preventDefault();
          dropzone.classList.remove('border-[var(--vuln-brand)]', 'bg-[var(--vuln-brand)]/5');
          uploadedFiles = Array.prototype.slice.call(e.dataTransfer.files);
          renderFileList();
        });

        function renderFileList() {
          if (!uploadedFiles.length) {
            fileListEl.innerHTML = '';
            return;
          }
          fileListEl.innerHTML = uploadedFiles.map(function(f, i) {
            return '<div class="flex items-center justify-between px-2 py-1 rounded bg-[var(--vuln-surface-2)]">'
              + '<span>' + esc(f.name) + ' <span class="text-[var(--vuln-ink-3)]">(' + (f.size / 1024).toFixed(1) + ' KB)</span></span>'
              + '<button type="button" data-remove="' + i + '" class="text-[var(--vuln-state-error)] hover:text-red-400">✕</button>'
              + '</div>';
          }).join('');
          fileListEl.querySelectorAll('[data-remove]').forEach(function(btn) {
            btn.addEventListener('click', function() {
              uploadedFiles.splice(parseInt(this.getAttribute('data-remove')), 1);
              renderFileList();
            });
          });
        }

        // ── 健康检查 ──────────────────────────────────
        function checkHealth() {
          fetch('/api/health')
            .then(function(r) { return r.json(); })
            .then(function(data) {
              var el = document.getElementById('engine-info');
              if (data.ollama_connected && data.model_available) {
                el.innerHTML = '引擎: <span class="text-[var(--vuln-state-success)]">●</span> ' + esc(data.model);
              } else if (data.ollama_connected) {
                el.innerHTML = '引擎: <span class="text-[var(--vuln-state-warning)]">●</span> 模型未就绪 (' + esc(data.model) + ')';
              } else {
                el.innerHTML = '引擎: <span class="text-[var(--vuln-state-error)]">●</span> Ollama 未连接';
              }
            })
            .catch(function() {
              document.getElementById('engine-info').textContent = '引擎: 后端未响应';
            });
        }

        // ── 筛选器 ──────────────────────────────────
        document.querySelectorAll('.filter-chip').forEach(function(chip) {
          chip.addEventListener('click', function() {
            document.querySelectorAll('.filter-chip').forEach(function(c) {
              c.classList.remove('active', 'bg-[var(--vuln-brand)]/10', 'text-[var(--vuln-brand)]');
              c.classList.add('text-[var(--vuln-ink-2)]');
            });
            this.classList.add('active', 'bg-[var(--vuln-brand)]/10', 'text-[var(--vuln-brand)]');
            this.classList.remove('text-[var(--vuln-ink-2)]');
            activeFilter = this.getAttribute('data-filter');
            applyFilter();
          });
        });

        // ── 代码展开/收起（事件委托） ──────────────────
        resultsPanel.addEventListener('click', function(e) {
          var btn = e.target.closest('.toggle-code');
          if (!btn) return;
          var code = btn.closest('.result-card').querySelector('.code-block');
          var expanded = !code.classList.contains('hidden');
          code.classList.toggle('hidden');
          btn.setAttribute('aria-expanded', String(!expanded));
          btn.textContent = expanded ? '展开详情' : '收起详情';
        });

        // ── 主分析逻辑 ──────────────────────────────────
        function getRag() {
          return document.getElementById('rag-toggle').checked;
        }

        async function analyzePaste() {
          var code = document.getElementById('code-input').value.trim();
          if (!code) { alert('请粘贴需要审计的代码'); return false; }
          showProgress('正在分析代码…');
          updateProgress(30, 'LLM 推理中…');
          var res = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: code, language: 'auto', filename: 'pasted_code.txt', use_rag: getRag() })
          });
          updateProgress(90, '整理结果…');
          var data = await res.json();
          if (!res.ok) { throw new Error(data.error || '分析失败'); }
          updateProgress(100, '完成');
          updateResults([data], null);
          return true;
        }

        async function analyzeUpload() {
          if (!uploadedFiles.length) { alert('请选择文件'); return false; }
          var formData = new FormData();
          uploadedFiles.forEach(function(f) { formData.append('files', f); });
          formData.append('rag', getRag());

          showProgress('正在批量扫描…');
          var res = await fetch('/api/batch', { method: 'POST', body: formData });
          if (!res.ok) {
            var err = await res.json().catch(function() { return {}; });
            throw new Error(err.error || '批量扫描失败');
          }

          var reader = res.body.getReader();
          var decoder = new TextDecoder();
          var buffer = '';
          var results = [];
          var summary = null;

          while (true) {
            var chunk = await reader.read();
            if (chunk.done) break;
            buffer += decoder.decode(chunk.value, { stream: true });
            var lines = buffer.split('\n');
            buffer = lines.pop();
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i].trim();
              if (!line) continue;
              var msg = JSON.parse(line);
              if (msg.type === 'progress') {
                var pct = msg.total > 0 ? Math.round(msg.scanned / msg.total * 100) : 0;
                updateProgress(pct, '已扫描 ' + msg.scanned + '/' + msg.total + ' (' + (msg.result.filename || '') + ')');
                if (msg.result) results.push(msg.result);
              } else if (msg.type === 'done') {
                summary = msg.summary;
              }
            }
          }
          updateProgress(100, '完成');
          updateResults(results, summary);
          return true;
        }

        async function analyzeUrl() {
          var url = document.getElementById('url-input').value.trim();
          if (!url) { alert('请输入 URL'); return false; }
          showProgress('正在抓取并扫描站点…');
          updateProgress(20, '抓取页面脚本…');
          var res = await fetch('/api/url-scan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url, use_rag: getRag() })
          });
          updateProgress(70, 'LLM 分析中…');
          var data = await res.json();
          if (!res.ok) { throw new Error(data.error || 'URL 扫描失败'); }
          updateProgress(100, '完成');
          var results = (data.summary && data.summary.results) || [];
          updateResults(results, data.summary);
          return true;
        }

        async function analyzeGithub() {
          var repo = document.getElementById('github-input').value.trim();
          if (!repo) { alert('请输入 GitHub 仓库地址'); return false; }
          // 补全 URL（owner/repo → https://github.com/owner/repo）
          if (repo.indexOf('http') !== 0) {
            repo = 'https://github.com/' + repo;
          }
          showProgress('正在克隆并扫描仓库…');
          updateProgress(15, 'git clone 中…（最多 120s）');
          var res = await fetch('/api/github-scan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ repo_url: repo, use_rag: getRag() })
          });
          updateProgress(80, 'LLM 分析中…');
          var data = await res.json();
          if (!res.ok) { throw new Error(data.error || 'GitHub 扫描失败'); }
          updateProgress(100, '完成');
          var results = (data.summary && data.summary.results) || [];
          updateResults(results, data.summary);
          return true;
        }

        // ── 绑定分析按钮 ──────────────────────────────────
        analyzeBtn.addEventListener('click', async function() {
          setBusy(true);
          try {
            var ok = false;
            if (currentTab === 'paste') ok = await analyzePaste();
            else if (currentTab === 'upload') ok = await analyzeUpload();
            else if (currentTab === 'url') ok = await analyzeUrl();
            else if (currentTab === 'github') ok = await analyzeGithub();
            if (!ok) hideProgress();
          } catch (err) {
            hideProgress();
            resultsPanel.innerHTML = '<div class="text-center py-12 text-[var(--vuln-state-error)] text-sm">⚠ ' + esc(err.message) + '</div>';
            resultCount.innerHTML = '共 <strong class="text-[var(--vuln-ink)]">0</strong> 项';
          } finally {
            setBusy(false);
          }
        });

        // ── 初始化 ──────────────────────────────────
        checkHealth();
      })();
    </script>
</body>
</html>
