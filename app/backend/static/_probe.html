<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>probe</title>
<style>
  body { font-family: monospace; font-size: 12px; }
  iframe { width: 1600px; height: 940px; border: 1px solid #999; display: block; margin-bottom: 12px; }
</style>
</head>
<body>
<div id="out">running...</div>
<script>
const sleep = ms => new Promise(r => setTimeout(r, ms));

function measureFrame(page) {
  return new Promise((resolve) => {
    const f = document.createElement('iframe');
    f.src = page;
    f.width = 1600; f.height = 940;
    document.body.appendChild(f);
    let done = false;
    const finish = (obj) => { if (!done) { done = true; try { document.body.removeChild(f); } catch (e) {} resolve(obj); } };
    f.onload = async () => {
      try {
        await sleep(2500);
        const d = f.contentDocument, w = f.contentWindow;
        const nav = d.querySelector('nav.nav-glass');
        const inner = nav ? nav.firstElementChild : null;
        const logo = d.querySelector('.nivis-logo');
        const wordmark = d.querySelector('.nivis-wordmark');
        const navItem = d.querySelector('.nav-item');
        const rect = el => {
          if (!el) return null;
          const b = el.getBoundingClientRect();
          return { x: +b.x.toFixed(2), y: +b.y.toFixed(2), w: +b.width.toFixed(2), h: +b.height.toFixed(2) };
        };
        const cs = el => el ? getComputedStyle(el) : null;
        const de = d.documentElement;
        finish({
          page,
          viewport: { w: w.innerWidth, h: w.innerHeight },
          scroll: {
            scrollHeight: de.scrollHeight,
            overflows: de.scrollHeight > w.innerHeight + 1,
            gutter: cs(de).scrollbarGutter,
            scrollbarW: w.innerWidth - de.clientWidth,
            overflowY: cs(de).overflowY
          },
          navRect: rect(nav),
          navCS: { pos: cs(nav) ? cs(nav).position : null, w: cs(nav) ? cs(nav).width : null },
          innerRect: rect(inner),
          innerCS: cs(inner) ? { maxW: cs(inner).maxWidth, h: cs(inner).height, display: cs(inner).display } : null,
          logoRect: rect(logo),
          wordmarkRect: rect(wordmark),
          navItemRect: rect(navItem)
        });
      } catch (e) {
        finish({ page, error: String(e) });
      }
    };
    f.onerror = () => finish({ page, error: 'iframe error' });
  });
}

async function donutTest() {
  try {
    const f = document.createElement('iframe');
    f.src = 'index.html'; f.width = 1600; f.height = 940;
    document.body.appendChild(f);
    await new Promise(r => { f.onload = r; });
    await sleep(2500);
    const d = f.contentDocument;
    const svg = d.getElementById('chart-donut');
    const out = {};
    if (!svg) { out.error = 'no #chart-donut'; return out; }
    const track = svg.querySelector('circle');
    const C = 2 * Math.PI * 50, len = C / 4;
    let offset = 0;
    const colors = ['var(--vuln-state-error)','var(--vuln-state-warning)','var(--vuln-state-success)','var(--vuln-state-info)'];
    for (let j = 0; j < 4; j++) {
      const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('class','donut-seg');
      c.setAttribute('cx',60); c.setAttribute('cy',60); c.setAttribute('r',50);
      c.setAttribute('fill','none'); c.setAttribute('stroke', colors[j]);
      c.setAttribute('stroke-width','12');
      c.setAttribute('stroke-dasharray', len.toFixed(2)+' '+(C-len).toFixed(2));
      c.setAttribute('stroke-dashoffset', (-offset).toFixed(2));
      c.setAttribute('transform','rotate(-90 60 60)');
      svg.appendChild(c);
      offset += len;
    }
    const r = el => { const b = el.getBoundingClientRect(); return { x:+b.x.toFixed(1), y:+b.y.toFixed(1), w:+b.width.toFixed(1), h:+b.height.toFixed(1), cx:+(b.x+b.width/2).toFixed(1), cy:+(b.y+b.height/2).toFixed(1) }; };
    const segs = svg.querySelectorAll('.donut-seg');
    out.withOverride = { track: r(track), segs: Array.from(segs).map(r) };
    // neutralize the transform-box override from lively.css
    const st = d.createElement('style');
    st.textContent = '#chart-donut .donut-seg { transform-box: view-box !important; }';
    d.head.appendChild(st);
    out.afterNeutralize = { track: r(track), segs: Array.from(segs).map(r) };
    document.body.removeChild(f);
    return out;
  } catch (e) {
    return { error: String(e) };
  }
}

async function run() {
  const pages = ['index.html','scan.html','cwe.html','posture.html'];
  const results = [];
  for (const p of pages) {
    try { results.push(await measureFrame(p)); } catch (e) { results.push({ page: p, error: String(e) }); }
  }
  results.push({ donut: await donutTest() });
  document.getElementById('out').textContent = JSON.stringify(results, null, 2);
}
run();
</script>
</body>
</html>
