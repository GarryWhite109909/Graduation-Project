    <script>(function(){try{var k='vuln-theme',s=localStorage.getItem(k),t=(s==='light'||s==='dark')?s:'dark';document.documentElement.classList.remove('light','dark');document.documentElement.classList.add(t);}catch(e){document.documentElement.classList.add('dark');}})();</script>

    <script src="./lib/tailwind.global.js"></script>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--vuln-background);
    --color-foreground: var(--vuln-foreground);
    --color-card: var(--vuln-card);
    --color-card-foreground: var(--vuln-card-foreground);
    --color-popover: var(--vuln-popover);
    --color-popover-foreground: var(--vuln-popover-foreground);
    --color-primary: var(--vuln-primary);
    --color-primary-foreground: var(--vuln-primary-foreground);
    --color-muted: var(--vuln-muted);
    --color-muted-foreground: var(--vuln-muted-foreground);
    --color-border: var(--vuln-border);
    --color-input: var(--vuln-input);
    --color-ring: var(--vuln-ring);
    --radius-sm: var(--vuln-radius-sm);
    --radius-md: var(--vuln-radius-md);
    --radius-lg: var(--vuln-radius-lg);
  }
  @layer base {
    body { background: var(--vuln-background); color: var(--vuln-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <!-- semantic-token-fallback 和全局滚动条样式已移入 design-tokens.css -->
    <link rel="stylesheet" href="./lively.css">
</head>
<body class="min-h-screen font-sans antialiased">
    <style id="page-recipe">
      /* === 卡片层级 — 克制版，透明度梯度建立层次 === */
      .card-primary {
        background: rgba(255,255,255,0.72);
        backdrop-filter: blur(20px) saturate(150%);
        -webkit-backdrop-filter: blur(20px) saturate(150%);
        border: 1px solid var(--vuln-line);
        box-shadow: var(--vuln-shadow-2);
        border-radius: var(--vuln-radius-lg);
      }
      .dark .card-primary {
        background: rgba(30,30,30,0.72);
        border: 1px solid rgba(255,255,255,0.08);
      }
      .card-secondary {
        background: var(--vuln-surface);
        border: 1px solid var(--vuln-line);
        box-shadow: var(--vuln-shadow-1);
        border-radius: var(--vuln-radius-lg);
      }
      .dark .card-secondary {
        border: 1px solid rgba(255,255,255,0.06);
      }
      .card-tertiary {
        background: var(--vuln-surface-2);
        border: 1px solid var(--vuln-line-2);
        border-radius: var(--vuln-radius-lg);
      }
      .dark .card-tertiary {
        border: 1px solid rgba(255,255,255,0.04);
      }

      /* === 动效 — 弹性弹起 + 延迟退出丝滑跟随，使用 lively.css 的 spring/bounce 曲线 === */
      .card-primary, .card-secondary, .card-tertiary {
        transition: transform 320ms var(--lv-spring, cubic-bezier(0.34,1.56,0.64,1)) var(--lv-out-delay),
                    border-color 250ms var(--lv-smooth, ease) var(--lv-out-delay),
                    box-shadow 320ms var(--lv-spring, cubic-bezier(0.34,1.56,0.64,1)) var(--lv-out-delay);
      }
      .card-primary:hover, .card-secondary:hover, .card-tertiary:hover { transition-delay: 0ms; }
      .card-primary:hover {
        transform: translateY(-4px);
        border-color: color-mix(in srgb, var(--vuln-brand) 30%, var(--vuln-line));
        box-shadow: 0 10px 28px rgba(11,15,20,0.10);
      }
      .card-secondary:hover {
        transform: translateY(-3px);
        border-color: color-mix(in srgb, var(--vuln-brand) 20%, var(--vuln-line));
      }
      .card-tertiary:hover { transform: translateY(-2px); }

      /* button / a 统一由 lively.css 管理 */

      .animate-in { animation: fadeUp 0.5s var(--lv-bounce, cubic-bezier(0.22,1,0.36,1)) backwards; }
      @media (prefers-reduced-motion: reduce) {
        .animate-in { animation: none; }
        .card-primary:hover, .card-secondary:hover, .card-tertiary:hover { transform: none; }
      }

      /* === Bento 布局 === */
      .bento-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; align-items: start; }
      .bento-main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .bento-side { position: sticky; top: 88px; }
      @media (max-width: 1024px) {
        .bento-grid { grid-template-columns: 1fr; }
        .bento-main { grid-template-columns: 1fr; }
        .bento-side { position: static; }
      }

      /* nav-item / logo / 品牌名 / 导航按钮样式统一在 lively.css */

      /* === KPI === */
      .kpi-icon {
        width: 36px; height: 36px; border-radius: var(--vuln-radius-md);
        display: inline-flex; align-items: center; justify-content: center;
        background: color-mix(in srgb, var(--kc) 12%, transparent);
        color: var(--kc); flex-shrink: 0;
      }

      /* === 风险徽章 — 左边框 + 文字色 === */
      .risk-badge {
        display: inline-flex; align-items: center; justify-content: center;
        background: transparent; border-left: 3px solid var(--rc);
        color: var(--rc); padding: 2px 8px; font-size: 12px; font-weight: 500;
        border-radius: 0 4px 4px 0; width: 52px; flex-shrink: 0;
      }

      /* === Donut 联动（过渡统一由 lively.css 管理，此处仅覆盖 active 态） === */
      .donut-seg.hl { stroke-width: 18; filter: drop-shadow(0 0 8px var(--sc)); }
      #chart-donut:hover .donut-seg.hl { opacity: 1; }
      .legend-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; opacity: 0.85; transition: opacity 200ms var(--lv-smooth) var(--lv-out-delay), transform 280ms var(--lv-spring) var(--lv-out-delay); cursor: pointer; }
      .legend-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
      .legend-item .count { font-variant-numeric: tabular-nums; }
      .legend-item.hl { transition-delay: 0ms; opacity: 1; transform: translateX(4px); color: var(--vuln-ink); font-weight: 600; }

      /* === 快捷入口 === */
      .icon-box {
        width: 40px; height: 40px; border-radius: var(--vuln-radius-md);
        display: inline-flex; align-items: center; justify-content: center;
        background: color-mix(in srgb, var(--vuln-brand) 10%, transparent);
        color: var(--vuln-brand); flex-shrink: 0;
      }
      .quick-entry {
        display: flex; align-items: center; gap: 12px; padding: 10px;
        border-radius: var(--vuln-radius-md); border: 1px solid transparent;
        transition: border-color 200ms ease var(--lv-out-delay), background-color 200ms ease var(--lv-out-delay), transform 200ms ease var(--lv-out-delay);
      }
      .quick-entry:hover {
        transition-delay: 0ms;
        border-color: color-mix(in srgb, var(--vuln-brand) 30%, transparent);
        background-color: color-mix(in srgb, var(--vuln-brand) 6%, transparent);
        transform: translateY(-1px);
      }
      .quick-entry .arrow { color: var(--vuln-ink-3); transition: transform 200ms ease var(--lv-out-delay), color 200ms ease var(--lv-out-delay); flex-shrink: 0; display: inline-flex; }
      .quick-entry:hover .arrow { transition-delay: 0ms; color: var(--vuln-brand); transform: translateX(2px); }

      .num-tabular { font-variant-numeric: tabular-nums; }
    </style>

    <!-- 固定顶部导航 -->
    <nav class="nav-glass fixed top-0 left-0 right-0 z-50 border-b border-[var(--vuln-line)]" aria-label="主导航">

        <div class="flex items-center gap-2">
          <button id="settings-open" class="nav-btn" type="button" aria-label="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <button id="theme-toggle" class="nav-btn" type="button" aria-label="切换主题"></button>
        </div>
      </div>

    <!-- 主内容容器 -->
    <div class="max-w-[1440px] mx-auto px-6 pt-24 pb-8">
      <!-- 页头 -->
      <header class="mb-8 animate-in" style="animation-delay:0ms">
        <div class="flex items-center gap-3 flex-wrap">
          <h1 class="text-2xl font-semibold tracking-tight" style="color: var(--vuln-ink)">仪表盘</h1>
          <span id="health-indicator" class="inline-flex items-center gap-1.5 text-xs text-muted-foreground">
            <span class="health-dot is-loading"></span>
            <span class="health-text">检测中</span>
          </span>
        </div>
        <p class="text-sm text-muted-foreground mt-1">实时掌握代码安全状态与扫描趋势</p>
      </header>

      <!-- KPI 核心指标区 -->
      <section id="kpi-section" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
        <div class="card-primary p-6 animate-in" style="animation-delay:0ms">
          <div class="flex items-center gap-2.5 mb-4">
            <span class="kpi-icon" style="--kc: var(--vuln-state-info)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg>
            </span>
            <span class="text-xs font-medium text-muted-foreground">近期扫描</span>
          </div>
          <div class="text-5xl font-bold tracking-tight num-tabular" style="color: var(--vuln-ink); line-height:1.1" id="kpi-scans">—</div>
          <p class="text-xs text-muted-foreground mt-2" id="kpi-scans-sub">次扫描</p>
        </div>

        <div class="card-primary p-6 animate-in" style="animation-delay:60ms">
          <div class="flex items-center gap-2.5 mb-4">
            <span class="kpi-icon" style="--kc: var(--vuln-state-error)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
            </span>
            <span class="text-xs font-medium text-muted-foreground">漏洞待修复</span>
          </div>
          <div class="text-5xl font-bold tracking-tight num-tabular" style="color: var(--vuln-state-error); line-height:1.1" id="kpi-vuln">—</div>
          <p class="text-xs text-muted-foreground mt-2" id="kpi-vuln-sub">待修复</p>
        </div>

        <div class="card-primary p-6 animate-in" style="animation-delay:120ms">
          <div class="flex items-center gap-2.5 mb-4">
            <span class="kpi-icon" style="--kc: var(--vuln-state-success)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
            </span>
            <span class="text-xs font-medium text-muted-foreground">安全文件占比</span>
          </div>
          <div class="flex items-baseline gap-1">
            <span class="text-5xl font-bold tracking-tight num-tabular" style="color: var(--vuln-ink); line-height:1.1" id="kpi-fix">—</span>
          </div>
          <p class="text-xs text-muted-foreground mt-2" id="kpi-fix-sub">安全文件占比</p>
        </div>

        <div class="card-primary p-6 animate-in" style="animation-delay:180ms">
          <div class="flex items-center gap-2.5 mb-4">
            <span class="kpi-icon" style="--kc: var(--vuln-state-warning)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
            </span>
            <span class="text-xs font-medium text-muted-foreground">平均风险权重</span>
          </div>
          <div class="flex items-baseline gap-1.5">
            <span class="text-5xl font-bold tracking-tight num-tabular" style="color: var(--vuln-state-warning); line-height:1.1" id="kpi-risk">—</span>
            <span class="text-sm text-muted-foreground">/10</span>
          </div>
          <p class="text-xs text-muted-foreground mt-2" id="kpi-risk-sub">中等风险水平</p>
        </div>
      </section>

      <!-- API 警告 -->
      <div id="api-warning" class="hidden mb-4 rounded-[var(--vuln-radius-md)] border border-[var(--vuln-state-warning)] bg-[color-mix(in_srgb,var(--vuln-state-warning)_10%,transparent)] px-4 py-3 text-sm" style="color: var(--vuln-ink)" role="alert">
        <span class="font-medium">后端服务未连接，显示为静态数据</span>
      </div>

      <!-- Bento 主区 -->
      <div class="bento-grid">
        <div class="bento-main">
          <!-- 风险分布 donut -->
          <div id="chart-donut-card" class="card-primary p-6 animate-in" style="animation-delay:240ms">
            <div class="flex items-center justify-between mb-5">
              <h3 class="text-sm font-semibold" style="color: var(--vuln-ink)">风险分布</h3>
              <span class="text-xs text-muted-foreground" id="donut-total-label">共 0 项</span>
            </div>
            <div class="flex flex-col sm:flex-row items-center gap-6">
              <div class="relative flex-shrink-0" style="width:160px;height:160px">
                <svg id="chart-donut" viewBox="0 0 120 120" width="160" height="160" role="img" aria-label="风险分布环形图">
                  <circle cx="60" cy="60" r="50" fill="none" stroke="var(--vuln-surface-2)" stroke-width="12"/>
                  <text id="donut-center-num" x="60" y="58" text-anchor="middle" fill="var(--vuln-ink)" font-size="20" font-weight="700">—</text>
                  <text id="donut-center-label" x="60" y="74" text-anchor="middle" fill="var(--vuln-ink-2)" font-size="11">风险</text>
                </svg>
              </div>
              <ul id="donut-legend" class="flex-1 w-full text-sm" style="color: var(--vuln-ink)">
                <li class="legend-item" style="color: var(--vuln-ink-3)"><span class="dot" style="background: var(--vuln-surface-2)"></span><span class="flex-1">暂无数据</span></li>
              </ul>
            </div>
          </div>

          <!-- 扫描趋势折线图 -->

              <span class="text-xs text-muted-foreground">近 7 次扫描</span>
            </div>
            <div style="width:100%">
              <svg id="chart-trend" viewBox="0 0 320 140" style="width:100%;height:auto;display:block" role="img" aria-label="扫描趋势折线图">
                <line x1="30" y1="115" x2="310" y2="115" stroke="var(--vuln-line)"/>
                <text x="160" y="75" text-anchor="middle" fill="var(--vuln-ink-3)" font-size="12">暂无历史数据，完成首次扫描后将显示趋势</text>
              </svg>
            </div>
          </div>

          <!-- 最近动态列表 -->

            <div class="flex items-center justify-between mb-4">
              <h3 class="text-sm font-semibold" style="color: var(--vuln-ink)">最近动态</h3>
              <a href="./scan.html" class="text-xs text-muted-foreground hover:text-foreground transition-colors">查看全部</a>
            </div>
            <ul id="recent-list" class="space-y-3">
              <li class="text-sm text-muted-foreground text-center py-8">暂无最近动态，完成首次扫描后将显示</li>
            </ul>
          </div>
        </div>

        <!-- 侧栏：快捷入口 -->
        <aside class="bento-side">
          <div id="quick-entries" class="card-tertiary p-6 animate-in" style="animation-delay:420ms">
            <h3 class="text-sm font-semibold mb-4" style="color: var(--vuln-ink)">快捷入口</h3>
            <div class="space-y-2">
              <a href="./scan.html" class="quick-entry">
                <span class="icon-box">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="M8 6l-6 6 6 6"/></svg>
                </span>
                <div class="flex-1 min-w-0">
                  <div class="text-sm font-medium" style="color: var(--vuln-ink)">粘贴代码分析</div>

                </div>
                <span class="arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
              </a>
              <a href="./scan.html" class="quick-entry">
                <span class="icon-box">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
                </span>
                <div class="flex-1 min-w-0">
                  <div class="text-sm font-medium" style="color: var(--vuln-ink)">上传文件扫描</div>
                  <div class="text-xs text-muted-foreground">批量上传项目文件</div>
                </div>
                <span class="arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
              </a>
              <a href="./posture.html" class="quick-entry">
                <span class="icon-box">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.5-.5-5.5-.5-8 1.5-1.96-.5-3-.5-3-.5-.28 1.15-.28 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-7-1-7.5-3"/></svg>
                </span>
                <div class="flex-1 min-w-0">
                  <div class="text-sm font-medium" style="color: var(--vuln-ink)">仓库安全态势</div>
                  <div class="text-xs text-muted-foreground">接入仓库持续监控</div>
                </div>
                <span class="arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
              </a>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <!-- 设置抽屉由 nivis-common.js 自动注入 -->

    <!-- 页脚 -->
    <footer class="border-t border-border mt-8 py-6">
      <div class="max-w-[1440px] mx-auto px-6 text-xs text-muted-foreground flex flex-col sm:flex-row justify-between gap-2">
        <span>Nivis · AI 代码漏洞静态分析平台 · 数据仅用于本地安全分析</span>
        <span id="footer-updated">—</span>
      </div>
    </footer>

    <script>lucide.createIcons();</script>
    <script src="./nivis-common.js"></script>
    <script>
(function () {
  'use strict';

  var HISTORY_KEY = window.NivisUtil.HISTORY_KEY;
  var MAX_HISTORY = window.NivisUtil.MAX_HISTORY;

  /* 工具函数引用共享模块 nivis-common.js */
  var escapeHtml = window.NivisUtil.escapeHtml.bind(window.NivisUtil);
  var setText = window.NivisUtil.setText.bind(window.NivisUtil);
  var formatNumber = window.NivisUtil.formatNumber.bind(window.NivisUtil);
  var normalizeRisk = window.NivisUtil.normalizeRisk.bind(window.NivisUtil);
  var riskWeight = window.NivisUtil.riskWeight.bind(window.NivisUtil);
  var riskBadge = window.NivisUtil.riskBadge.bind(window.NivisUtil);
  var relativeTime = window.NivisUtil.relativeTime.bind(window.NivisUtil);
  var getHistory = window.NivisUtil.getHistory.bind(window.NivisUtil);

  function computeStatsFromHistory() {
    var hist = getHistory();
    var totalFiles = 0, totalVuln = 0, totalSafe = 0;
    var findings = [];
    hist.forEach(function (entry) {
      var tf = entry.total_files != null ? entry.total_files : (entry.total || 0);
      var vuln = entry.vulnerable != null ? entry.vulnerable : 0;
      var safe = entry.safe != null ? entry.safe : 0;
      if (!tf && Array.isArray(entry.results)) {
        tf = entry.results.length;
        vuln = entry.results.filter(function(r){return r&&r.has_vulnerability===true;}).length;
        safe = tf - vuln;
      }
      totalFiles += tf; totalVuln += vuln; totalSafe += safe;
      if (Array.isArray(entry.results)) {
        entry.results.forEach(function(r) {
          if (r && r.has_vulnerability === true) {
            findings.push({ filename: r.filename, vulnerability_type: r.vulnerability_type, risk_level: r.risk_level, timestamp: entry.date });
          }
        });
      }
    });
    findings.sort(function(a,b){return new Date(b.timestamp||0).getTime()-new Date(a.timestamp||0).getTime();});
    return { total_files: totalFiles, total_vulnerable: totalVuln, total_safe: totalSafe, recent_findings: findings.slice(0,10) };
  }

  function updateKpis(data) {
    var totalFiles = data.total_files || 0;
    var totalVuln = data.total_vulnerable || 0;
    var totalSafe = data.total_safe || 0;
    setText('kpi-scans', formatNumber(totalFiles));
    setText('kpi-scans-sub', '次扫描');
    setText('kpi-vuln', formatNumber(totalVuln));
    setText('kpi-vuln-sub', totalVuln > 0 ? '待修复' : '暂无漏洞');
    var denom = totalSafe + totalVuln;
    var fixRate = denom > 0 ? Math.round((totalSafe/denom)*100) : null;
    setText('kpi-fix', fixRate === null ? '—' : fixRate + '%');
    setText('kpi-fix-sub', fixRate === null ? '暂无数据' : '安全文件 / 总文件');
    var findings = data.recent_findings || [];
    var avgScore = null;
    if (Array.isArray(findings) && findings.length > 0) {
      var sum = 0; for (var i=0;i<findings.length;i++) sum += riskWeight(normalizeRisk(findings[i].risk_level));
      avgScore = (sum/findings.length).toFixed(1);
    }
    setText('kpi-risk', avgScore === null ? '—' : avgScore);
    setText('kpi-risk-sub', avgScore === null ? '暂无数据' : (parseFloat(avgScore)>=6?'高风险水平':parseFloat(avgScore)>=4?'中等风险水平':'低风险水平'));
  }

  /* Donut */
  function updateDonut(findings) {
    var svg = document.getElementById('chart-donut');
    var legend = document.getElementById('donut-legend');
    var totalLabel = document.getElementById('donut-total-label');
    var counts = { high: 0, medium: 0, low: 0, info: 0 };
    if (Array.isArray(findings)) {
      for (var i=0;i<findings.length;i++) {
        var lvl = normalizeRisk(findings[i].risk_level);
        if (lvl==='critical'||lvl==='high') counts.high++;
        else if (lvl==='medium') counts.medium++;
        else if (lvl==='low') counts.low++;
        else counts.info++;
      }
    }
    var total = counts.high+counts.medium+counts.low+counts.info;
    var segments = [
      { value: counts.high, color: 'var(--vuln-state-error)', label: '高危' },
      { value: counts.medium, color: 'var(--vuln-state-warning)', label: '中危' },
      { value: counts.low, color: 'var(--vuln-state-success)', label: '低危' },
      { value: counts.info, color: 'var(--vuln-state-info)', label: '信息' }
    ];
    if (totalLabel) totalLabel.textContent = '共 ' + total + ' 项';

    if (svg) {
      var inner = '<circle cx="60" cy="60" r="50" fill="none" stroke="var(--vuln-surface-2)" stroke-width="12"/>';
      if (total > 0) {
        var R = 50, C = 2*Math.PI*R, offset = 0;
        for (var j=0;j<segments.length;j++) {
          var seg = segments[j]; if (seg.value===0) continue;
          var len = (seg.value/total)*C;
          inner += '<circle class="donut-seg" data-seg="'+j+'" cx="60" cy="60" r="50" fill="none" stroke="'+seg.color+'" stroke-width="12" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-offset).toFixed(2)+'" transform="rotate(-90 60 60)" style="--sc:'+seg.color+';cursor:pointer;"/>';
          offset += len;
        }
      }
      inner += '<text id="donut-center-num" x="60" y="58" text-anchor="middle" fill="var(--vuln-ink)" font-size="20" font-weight="700">'+(total>0?total:'—')+'</text>';
      inner += '<text id="donut-center-label" x="60" y="74" text-anchor="middle" fill="var(--vuln-ink-2)" font-size="11">风险</text>';
      svg.innerHTML = inner;
      svg.setAttribute('aria-label', '风险分布：高危 '+counts.high+'、中危 '+counts.medium+'、低危 '+counts.low+'、信息 '+counts.info);
    }
    if (legend) {
      var li = '';
      for (var k=0;k<segments.length;k++) {
        var s = segments[k];
        li += '<li class="legend-item" data-seg="'+k+'"><span class="dot" style="background:'+s.color+'"></span><span class="flex-1">'+s.label+'</span><span class="count" style="color:var(--vuln-ink-2)">'+s.value+'</span></li>';
      }
      legend.innerHTML = li;
      wireDonutLegend();
    }
  }

  function wireDonutLegend() {
    var svg = document.getElementById('chart-donut');
    var legend = document.getElementById('donut-legend');
    if (!svg||!legend) return;
    var segs = svg.querySelectorAll('.donut-seg');
    var legs = legend.querySelectorAll('.legend-item');
    var centerNum = svg.querySelector('#donut-center-num');
    var centerLabel = svg.querySelector('#donut-center-label');
    var resetNum = centerNum ? centerNum.textContent : '';
    var resetLabel = centerLabel ? centerLabel.textContent : '';
    function setHl(i, on) {
      segs.forEach(function(s){ if(s.getAttribute('data-seg')===i){ if(on)s.classList.add('hl');else s.classList.remove('hl'); } });
      legs.forEach(function(l){ if(l.getAttribute('data-seg')===i){ if(on)l.classList.add('hl');else l.classList.remove('hl'); } });
      if (on && centerNum && centerLabel) {
        var seg = segmentsByIndex(i);
        if (seg) {
          var pct = total_ > 0 ? Math.round(seg.value/total_*100) : 0;
          centerNum.textContent = pct+'%';
          centerLabel.textContent = seg.label+' '+seg.value;
        }
      } else if (centerNum && centerLabel) {
        centerNum.textContent = resetNum;
        centerLabel.textContent = resetLabel;
      }
    }
    var total_ = 0, segmentsByIndex_ = {};
    function segmentsByIndex(i){ return segmentsByIndex_[i]; }
    segs.forEach(function(s){
      var i = s.getAttribute('data-seg');
      var val = parseInt(s.getAttribute('stroke-dasharray'));
      segmentsByIndex_[i] = { value: 0, label: '' };
      s.addEventListener('mouseenter', function(){ setHl(i, true); });
      s.addEventListener('mouseleave', function(){ setHl(i, false); });
    });
    legs.forEach(function(l){
      var i = l.getAttribute('data-seg');
      l.addEventListener('mouseenter', function(){ setHl(i, true); });
      l.addEventListener('mouseleave', function(){ setHl(i, false); });
    });
  }

  /* Trend chart */
  function updateTrend() {
    var svg = document.getElementById('chart-trend');
    if (!svg) return;
    var hist = getHistory();
    if (!hist.length) {
      svg.innerHTML = '<line x1="30" y1="115" x2="310" y2="115" stroke="var(--vuln-line)"/><text x="160" y="75" text-anchor="middle" fill="var(--vuln-ink-3)" font-size="12">暂无历史数据，完成首次扫描后将显示趋势</text>';
      return;
    }
    var data = hist.slice(-MAX_HISTORY);
    var left=30, right=310, top=10, bottom=115;
    var w = right-left, maxTotal=1;
    for (var i=0;i<data.length;i++) if ((data[i].total||0)>maxTotal) maxTotal = data[i].total||0;
    var stepX = data.length>1 ? w/(data.length-1) : 0;
    var pts=[], circles='', dateLabels='';
    for (var p=0;p<data.length;p++) {
      var x = data.length>1 ? left+p*stepX : (left+right)/2;
      var y = bottom-((data[p].total||0)/maxTotal)*(bottom-top);
      pts.push(x.toFixed(1)+','+y.toFixed(1));
      circles += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.5" fill="var(--vuln-brand)"/>';
      var dd = new Date(data[p].date);
      if (!isNaN(dd.getTime())) {
        var mm = String(dd.getMonth()+1).padStart(2,'0'), dy = String(dd.getDate()).padStart(2,'0');
        dateLabels += '<text x="'+x.toFixed(1)+'" y="130" text-anchor="middle" fill="var(--vuln-ink-3)" font-size="9">'+mm+'-'+dy+'</text>';
      }
    }
    var inner = '<defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--vuln-brand)" stop-opacity="0.35"/><stop offset="100%" stop-color="var(--vuln-brand)" stop-opacity="0"/></linearGradient></defs>';
    inner += '<line x1="30" y1="10" x2="310" y2="10" stroke="var(--vuln-line)" stroke-dasharray="2 4"/>';
    inner += '<line x1="30" y1="115" x2="310" y2="115" stroke="var(--vuln-line)"/>';
    inner += '<text x="4" y="13" font-size="9" fill="var(--vuln-ink-3)">'+maxTotal+'</text>';
    inner += '<text x="4" y="118" font-size="9" fill="var(--vuln-ink-3)">0</text>';
    if (pts.length>=2) {
      var lastX = data.length>1 ? left+(data.length-1)*stepX : (left+right)/2;
      inner += '<path d="M'+pts[0]+' L'+pts.slice(1).join(' L')+' L'+lastX.toFixed(1)+',115 L30,115 Z" fill="url(#trendGrad)"/>';
      inner += '<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--vuln-brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    inner += circles + dateLabels;
    svg.innerHTML = inner;
  }

  /* Recent list */
  function updateRecent(findings) {
    var ul = document.getElementById('recent-list');
    if (!ul) return;
    if (!Array.isArray(findings)||!findings.length) {
      ul.innerHTML = '<li class="text-sm text-muted-foreground text-center py-8">暂无最近动态</li>';
      return;
    }
    var items = '';
    var n = Math.min(findings.length, 5);
    for (var i=0;i<n;i++) {
      var f = findings[i]||{};
      var lvl = normalizeRisk(f.risk_level);
      var badge = riskBadge(lvl);
      var fname = escapeHtml(f.filename||'未知文件');
      var vtype = escapeHtml(f.vulnerability_type||'未知漏洞');
      var ts = escapeHtml(relativeTime(f.timestamp));
      items += '<li class="flex items-center gap-3">'
        + '<span class="risk-badge" style="--rc:'+badge.color+'">'+badge.label+'</span>'
        + '<span class="font-mono text-sm flex-1 truncate" style="color:var(--vuln-ink)">'+fname+'</span>'
        + '<span class="text-sm text-muted-foreground hidden sm:inline">'+vtype+'</span>'
        + '<span class="text-xs text-muted-foreground flex-shrink-0">'+ts+'</span>'
        + '</li>';
    }
    ul.innerHTML = items;
  }

  /* Status */
  function updateStatus(health) {
    var el = document.getElementById('health-indicator');
    if (!el) return;
    var ok = !!(health && health.ollama_connected);
    var level = ok ? 'ok' : 'err';
    var label = ok ? '后端已连接' : '后端未连接';
    if (ok && health.model) label += ' · ' + health.model;
    el.innerHTML = '<span class="health-dot is-'+level+'"></span><span class="health-text">'+escapeHtml(label)+'</span>';
  }
  function showError() { var b = document.getElementById('api-warning'); if (b) b.classList.remove('hidden'); }

  function updateFooterTime() {
    var el = document.getElementById('footer-updated');
    if (!el) return;
    var d = new Date(), pad = function(n){return String(n).padStart(2,'0');};
    el.textContent = '数据更新于 '+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+' CST';
  }

  function init() {
    updateTrend();
    updateFooterTime();
    var histStats = computeStatsFromHistory();
    if (histStats.total_files>0 || histStats.recent_findings.length>0) {
      updateKpis(histStats);
      updateDonut(histStats.recent_findings);
      updateRecent(histStats.recent_findings);
    } else {
      updateKpis({total_files:0,total_vulnerable:0,total_safe:0,recent_findings:[]});
      updateDonut([]);
      updateRecent([]);
    }

    var statsAbort = new AbortController();
    var statusAbort = null;
    fetch('/api/stats', {signal: statsAbort.signal})
      .then(function(res){ if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
      .then(function(data){
        // 仪表盘显示所有分析过的代码的数据。
        // localStorage 包含所有来源（粘贴/上传/URL/GitHub/演示）且持久化，优先采用。
        // 后端 stats 不含单文件 /api/analyze，仅作 localStorage 为空时的补充。
        if (histStats.total_files === 0 && histStats.recent_findings.length === 0) {
          updateKpis(data);
          updateDonut(data.recent_findings||[]);
          updateRecent(data.recent_findings||[]);
        }
      })
      .catch(function(err){ if (err && err.name === 'AbortError') return; showError(); });

    /* 验证响应是否为真正的 JSON API（防止静态服务器返回 HTML 时误判为已连接） */
    function isApiJson(res) {
      var ct = res.headers.get('content-type') || '';
      return res.ok && ct.indexOf('application/json') !== -1;
    }
    /* 直接设置状态点 + 文案（level: ok/warn/err） */
    function setStatus(level, label) {
      var el = document.getElementById('health-indicator');
      if (!el) return;
      el.innerHTML = '<span class="health-dot is-'+level+'"></span><span class="health-text">'+escapeHtml(label)+'</span>';
    }
    /* 后端 = bat/sh 脚本启动的进程（/api/health/live）
       引擎 = 本地下载的模型（/api/health 的 ollama_connected + model）
       两个维度独立检测，文案同时体现。 */
    fetch('/api/health/live', {signal: statsAbort.signal})
      .then(function(res){ return isApiJson(res) ? res.json() : null; })
      .then(function(live){
        if (!live || !live.status) { setStatus('err','后端未连接'); return null; }
        setStatus('loading','后端已连接 · 检测引擎…');
        statusAbort = new AbortController();
        return fetch('/api/health', {signal: statusAbort.signal})
          .then(function(r){ return isApiJson(r) ? r.json() : null; })
          .then(function(health){
            statusAbort = null;
            if (!health) { setStatus('warn','后端已连接 · 引擎检测失败'); return; }
            if (health.ollama_connected || health.vllm_connected) {
              var m = health.model || (health.vllm_connected ? 'vLLM' : 'unknown');
              setStatus('ok', '后端已连接 · 引擎就绪 · ' + m);
            } else {
              setStatus('warn','后端已连接 · 引擎未就绪');
            }
          });
      })
      .catch(function(err){
        statusAbort = null;
        if (err && err.name === 'AbortError') return;
        setStatus('err','后端未连接');
      });
    window.addEventListener('pagehide',function(){
      if(statsAbort){try{statsAbort.abort();}catch(e){}statsAbort=null;}
      if(statusAbort){statusAbort.abort();statusAbort=null;}
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
    </script>
