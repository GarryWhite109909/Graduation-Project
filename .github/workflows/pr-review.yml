# PR 漏洞扫描 —— 基于 LLM + RAG 的自动化代码安全审查
#
# 设计目标：
# - 在 PR 提交 Python 代码时自动拉起 Ollama + 微调模型，逐文件扫描漏洞
# - 将检测结果以评论形式贴在 PR 上，**仅信息性，不阻断合并**
# - 任何扫描环节失败均通过 continue-on-error 容错，保证 CI 不阻塞 PR
#
# 触发条件：针对 .py 文件的 pull_request（opened/synchronize/reopened）

name: PR 漏洞扫描

# 注：用引号包裹 on，避免 YAML 1.1 将裸 on: 解析为布尔值（GitHub Actions 官方推荐写法）
"on":
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.py'

# 仅信息性审查，写评论即可，故只需拉取代码与写 PR 评论权限
permissions:
  contents: read
  pull-requests: write

# 离线模式：避免 sentence-transformers / transformers 在 CI 中访问 HuggingFace
# （CI 无 HF 缓存，联网会失败；Scanner 会自动回退到纯 LLM 模式）
env:
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'

jobs:
  vuln-scan:
    name: 漏洞扫描
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 需要完整 git 历史以计算 PR diff
          fetch-depth: 0

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: 启动 Ollama 服务
        run: |
          # 后台启动 ollama serve 并等待就绪
          ollama serve > ollama.log 2>&1 &
          echo $! > ollama.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama 服务就绪"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama 服务启动超时，日志如下："
          cat ollama.log || true
          exit 1

      - name: 拉取扫描模型
        id: pull-model
        run: |
          # 优先拉取微调模型；失败则回退到官方 Qwen3-8B
          if ollama pull garrywhite109909/graduation-vuln-scanner:v5; then
            echo "model=garrywhite109909/graduation-vuln-scanner:v5" >> "$GITHUB_OUTPUT"
            echo "主模型拉取成功"
          else
            echo "主模型拉取失败，回退到 qwen3:8b"
            ollama pull qwen3:8b
            echo "model=qwen3:8b" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            tree-sitter \
            tree-sitter-python \
            tree-sitter-javascript \
            tree-sitter-java \
            chromadb \
            sentence-transformers

      - name: 获取变更的 Python 文件
        id: changed
        run: |
          # 拉取 base 分支以计算 diff
          git fetch origin "${{ github.base_ref }}"
          # 列出新增/修改/重命名的 .py 文件（ACMR 过滤，排除删除的文件）
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}...HEAD" -- '*.py')
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "无 Python 文件变更，跳过扫描"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${FILES[@]}" > changed_python_files.txt
            echo "待扫描文件："
            cat changed_python_files.txt
          fi

      - name: 运行漏洞扫描
        id: scan
        if: steps.changed.outputs.skip != 'true'
        continue-on-error: true
        env:
          # 让 ci_scan.py 使用已成功拉取的模型
          VULN_SCANNER_MODEL: ${{ steps.pull-model.outputs.model }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # 以 Markdown 评论格式输出扫描结果（即使扫描出错也输出 warning 评论）
          python scripts/ci_scan.py --format comment $(cat changed_python_files.txt) \
            > pr_comment.md 2> scan_err.log
          echo "扫描退出码: $?"
          echo "--- 评论内容预览 ---"
          cat pr_comment.md
          if [ -s scan_err.log ]; then
            echo "--- 扫描日志（stderr） ---"
            cat scan_err.log
          fi

      - name: 在 PR 上发表评论
        if: steps.changed.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 将扫描结果作为评论发布到 PR（信息性，不阻断合并）
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file pr_comment.md

      - name: 无变更文件提示
        if: steps.changed.outputs.skip == 'true'
        run: echo "本次 PR 无 Python 文件变更，已跳过漏洞扫描。"
