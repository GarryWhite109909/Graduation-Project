[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graduation-project"
version = "0.1.0"
description = "基于大语言模型的代码安全分析系统"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.5",
    "chromadb>=1.5.9",
    "sentence-transformers>=5.6.0",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]
merge = [
    "peft>=0.13.0",
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
]

[tool.setuptools]
packages = ["graduation_project", "app", "app.backend", "app.backend.services", "app.launcher"]
